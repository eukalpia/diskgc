<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="diskgc: a background disk cleaner for developer machines">
<style>
.bar { animation: bar 8s ease-in-out infinite; }
@keyframes bar {
  0.0% { width: 460.0px; fill: #f85149; }
  18.0% { width: 460.0px; fill: #f85149; }
  22.0% { width: 460.0px; fill: #f85149; }
  28.0% { width: 360.0px; fill: #79c0ff; }
  36.0% { width: 360.0px; fill: #79c0ff; }
  42.0% { width: 275.0px; fill: #79c0ff; }
  50.0% { width: 275.0px; fill: #79c0ff; }
  56.0% { width: 190.0px; fill: #3fb950; }
  86.0% { width: 190.0px; fill: #3fb950; }
  97.0% { width: 460.0px; fill: #f85149; }
  100.0% { width: 460.0px; fill: #f85149; }
}
.cursor { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.i0 { animation: item0 8s ease-in-out infinite; }
.i0 .strike { stroke-dasharray: 480; animation: strike0 8s ease-in-out infinite; }
@keyframes item0 {
  0%, 4.0% { opacity: 0; transform: translateX(16px); }
  9.0%, 26.0% { opacity: 1; transform: translateX(0); }
  32.0%, 100% { opacity: 0.28; transform: translateX(0); }
}
@keyframes strike0 {
  0%, 22.0% { stroke-dashoffset: 480; }
  27.0%, 92% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 480; }
}
.i1 { animation: item1 8s ease-in-out infinite; }
.i1 .strike { stroke-dasharray: 480; animation: strike1 8s ease-in-out infinite; }
@keyframes item1 {
  0%, 7.0% { opacity: 0; transform: translateX(16px); }
  12.0%, 40.0% { opacity: 1; transform: translateX(0); }
  46.0%, 100% { opacity: 0.28; transform: translateX(0); }
}
@keyframes strike1 {
  0%, 36.0% { stroke-dashoffset: 480; }
  41.0%, 92% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 480; }
}
.i2 { animation: item2 8s ease-in-out infinite; }
.i2 .strike { stroke-dasharray: 480; animation: strike2 8s ease-in-out infinite; }
@keyframes item2 {
  0%, 10.0% { opacity: 0; transform: translateX(16px); }
  15.0%, 54.0% { opacity: 1; transform: translateX(0); }
  60.0%, 100% { opacity: 0.28; transform: translateX(0); }
}
@keyframes strike2 {
  0%, 50.0% { stroke-dashoffset: 480; }
  55.0%, 92% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: 480; }
}

.u0 { opacity: 0; animation: u0 8s linear infinite; }
.u1 { opacity: 0; animation: u1 8s linear infinite; }
@keyframes u1 { 0%, 25.0% { opacity: 0; } 26.0%, 38.0% { opacity: 1; } 39.0%, 100% { opacity: 0; } }
.u2 { opacity: 0; animation: u2 8s linear infinite; }
@keyframes u2 { 0%, 39.0% { opacity: 0; } 40.0%, 52.0% { opacity: 1; } 53.0%, 100% { opacity: 0; } }
.u3 { opacity: 0; animation: u3 8s linear infinite; }
@keyframes u3 { 0%, 53.0% { opacity: 0; } 54.0%, 95.0% { opacity: 1; } 96.0%, 100% { opacity: 0; } }
@keyframes u0 { 0%, 24.0% { opacity: 1; } 25.0%, 96.0% { opacity: 0; } 97.0%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .bar, .item, .strike, .u, .cursor { animation: none !important; }
  .item, .u0 { opacity: 1; }
}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>
<rect width="1280" height="300" rx="18" fill="url(#bg)"/>
<rect width="1280" height="300" rx="18" fill="url(#grid)" opacity="0.5"/>
<rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#30363d"/>

<g transform="translate(72 0)">
  <text x="0" y="128" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">disk<tspan fill="#7ee787">gc</tspan></text>
  <rect class="cursor" x="266" y="72" width="34" height="60" rx="3" fill="#7ee787" opacity="0.85"/>
  <text x="2" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">A background disk cleaner for developer machines</text>
  <text x="2" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">that knows what it is deleting — and tells you why.</text>
  <text x="2" y="252" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#79c0ff">macOS · Linux · Windows   ·   Rust   ·   Apache-2.0</text>
</g>

<text x="700" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e">disk</text>
<text class="u u0" x="1200" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="end">92% used</text><text class="u u1" x="1200" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="end">72% used</text><text class="u u2" x="1200" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="end">55% used</text><text class="u u3" x="1200" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="end">38% used</text>
<rect x="700" y="92" width="500" height="22" rx="6" fill="#21262d"/>
<rect class="bar" x="700" y="92" width="460.0" height="22" rx="6" fill="#f85149"/>

  <g class="item i0">
    <rect x="700" y="136" width="500" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="714" y="156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3">~/work/api/target</text>
    <text x="1186" y="156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e" text-anchor="end">41.2 GB</text>
    <line class="strike" x1="710" y1="151" x2="1190" y2="151" stroke="#3fb950" stroke-width="2"/>
  </g>
  <g class="item i1">
    <rect x="700" y="174" width="500" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="714" y="194" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3">~/web/node_modules</text>
    <text x="1186" y="194" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e" text-anchor="end">15.1 GB</text>
    <line class="strike" x1="710" y1="189" x2="1190" y2="189" stroke="#3fb950" stroke-width="2"/>
  </g>
  <g class="item i2">
    <rect x="700" y="212" width="500" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="714" y="232" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3">~/.cache/go-build</text>
    <text x="1186" y="232" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e" text-anchor="end">14.0 GB</text>
    <line class="strike" x1="710" y1="227" x2="1190" y2="227" stroke="#3fb950" stroke-width="2"/>
  </g>
</svg>
